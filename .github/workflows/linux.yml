name: Linux Build & Release

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux packaging tools (dpkg, rpmbuild, file, fuse)
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg rpm file desktop-file-utils curl

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --lib --bins --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package universal Linux formats (.tar.gz, .deb, .rpm, .AppImage)
        run: bash scripts/package-linux.sh

      - name: Upload Linux release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/iPhone-Mirror-v*-linux-x86_64.tar.gz
            dist/iphone-mirror_*_amd64.deb
            dist/iphone-mirror-*-1.x86_64.rpm
            dist/iPhone-Mirror-v*-x86_64.AppImage
            dist/SHA256SUMS-linux-x86_64.txt
