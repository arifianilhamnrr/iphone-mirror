[package]
name = "iphone-mirror-rs"
version = "0.1.0"
edition = "2021"
description = "Native zero-copy 60fps iPhone screen mirroring & HID touch control for macOS/Hackintosh"
license = "GPL-3.0"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
flate2 = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Core iOS Device Interaction (usbmuxd, RemoteXPC, RSD tunnel)
# Pure Rust stack interfacing with lockdownd, usbmuxd & CoreDevice
idevice = { git = "https://github.com/jkcoxson/idevice", branch = "main" }

# Serialization / Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plist = "1.6"

# macOS Native Frameworks (only compiled on target_os = "macos")
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = "0.2"
core-foundation = "0.9"
winit = "0.30"
raw-window-handle = "0.6"

[[bin]]
name = "iphone-mirror"
path = "src/main.rs"

[lib]
name = "iphone_mirror_rs"
path = "src/lib.rs"
