[package]
name = "iphone-mirror-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Native zero-copy 60fps iPhone screen mirroring & HID touch control for macOS/Hackintosh"
license = "GPL-3.0"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
flate2 = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"] }

# Core iOS Device Interaction (usbmuxd, RemoteXPC, RSD tunnel)
# Pure Rust stack interfacing with lockdownd, usbmuxd & CoreDevice
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "89702099f4d7552f704f93b4526756abda319ceb", default-features = false, features = [
    "afc",
    "core_device_proxy",
    "cryptexd",
    "display_stream",
    "mobile_image_mounter",
    "remote_pairing",
    "ring",
    "springboardservices",
    "tunnel_tcp_stack",
    "usbmuxd",
] }

# Serialization / Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plist = "1.6"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
x25519-dalek = "2.0"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
rand = "0.8"

# macOS Native Frameworks (macOS 15 Sequoia / macOS 26 Tahoe)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = "0.2"
core-foundation = "0.9"
winit = "0.30"
raw-window-handle = "0.6"
metal = "0.29"
foreign-types = "0.5"
objc = "0.2"
core-graphics-types = "0.1"

[build-dependencies]
cc = "1.1"

[[bin]]
name = "iphone-mirror"
path = "src/main.rs"

[lib]
name = "iphone_mirror_rs"
path = "src/lib.rs"
